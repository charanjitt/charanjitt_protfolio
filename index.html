<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Skyline Weather</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef4ff;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --text: #17233b;
      --muted: #6f7d96;
      --line: rgba(74, 101, 150, 0.15);
      --accent: #4279e8;
      --accent-strong: #285dc7;
      --accent-soft: #dce9ff;
      --shadow: 0 24px 70px rgba(50, 83, 142, 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --surface: rgba(30, 41, 59, 0.82);
        --surface-solid: #1e293b;
        --text: #f2f6ff;
        --muted: #9aa9c2;
        --line: rgba(190, 211, 247, 0.14);
        --accent: #83aefb;
        --accent-strong: #a8c4ff;
        --accent-soft: #263d68;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 6%, rgba(108, 173, 255, 0.27), transparent 34%),
        radial-gradient(circle at 90% 85%, rgba(255, 198, 116, 0.18), transparent 30%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .app {
      width: min(100% - 32px, 620px);
      margin: 0 auto;
      padding: 42px 0 36px;
    }

    header { margin-bottom: 24px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 24px;
      height: 2px;
      border-radius: 99px;
      background: var(--accent);
      content: "";
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 2.7rem);
      letter-spacing: -0.055em;
      line-height: 1.05;
    }
    .subtitle { margin: 10px 0 0; color: var(--muted); }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .search input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      padding: 13px 15px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(53, 86, 135, .05);
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      color: #fff;
      background: var(--accent-strong);
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: transform .2s, filter .2s;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .7; transform: none; }

    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .location-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }
    .location { margin: 0; font-size: 1.3rem; letter-spacing: -.025em; }
    .date { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .condition {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 26px;
      color: var(--muted);
      font-size: 14px;
    }
    .weather-icon { font-size: 4.4rem; line-height: .9; filter: drop-shadow(0 8px 10px rgba(30, 70, 130, .12)); }
    .current {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 30px 0 28px;
    }
    .temperature {
      margin: 0;
      font-size: clamp(4.5rem, 20vw, 6.7rem);
      font-weight: 760;
      letter-spacing: -.1em;
      line-height: .85;
    }
    .temperature sup { margin-left: 5px; color: var(--accent-strong); font-size: .32em; letter-spacing: -.03em; vertical-align: top; }
    .details { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    .details strong { color: var(--text); font-weight: 650; }
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 0 13px;
      font-size: 14px;
    }
    .section-heading span { color: var(--muted); font-size: 12px; font-weight: 500; }
    .forecast {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .day {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 7px;
      text-align: center;
      background: color-mix(in srgb, var(--surface-solid) 42%, transparent);
    }
    .day-name { color: var(--muted); font-size: 12px; font-weight: 700; }
    .day-icon { margin: 10px 0; font-size: 1.65rem; }
    .high { font-weight: 750; }
    .low { margin-left: 3px; color: var(--muted); font-size: 12px; }
    .status {
      min-height: 21px;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .status.error { color: #d15b5b; }
    footer { margin-top: 17px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 480px) {
      .app { width: min(100% - 22px, 620px); padding-top: 27px; }
      .panel { padding: 19px 15px; border-radius: 20px; }
      .current { gap: 14px; }
      .weather-icon { font-size: 3.7rem; }
      .forecast { gap: 5px; }
      .day { padding-inline: 3px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Daily conditions</p>
      <h1>Find your forecast.</h1>
      <p class="subtitle">A calm look at what the sky has planned.</p>
    </header>

    <form class="search" id="search-form">
      <input id="city-input" type="search" placeholder="Search a city…" value="Tokyo" aria-label="City name">
      <button id="search-button" type="submit">Search</button>
    </form>

    <section class="panel" aria-live="polite">
      <div class="location-row">
        <div>
          <h2 class="location" id="location">Tokyo, Japan</h2>
          <p class="date" id="date"></p>
        </div>
        <div class="weather-icon" id="weather-icon" aria-hidden="true">☀️</div>
      </div>
      <div class="current">
        <p class="temperature"><span id="temperature">18</span><sup>°C</sup></p>
        <div class="details">
          <div id="condition"><strong>Clear sky</strong></div>
          <div>Feels like <strong id="feels-like">18°C</strong></div>
          <div>Wind <strong id="wind">12 km/h</strong></div>
        </div>
      </div>
      <div class="section-heading">
        <span>UPCOMING</span>
        <span>High / low</span>
      </div>
      <div class="forecast" id="forecast"></div>
      <p class="status" id="status" role="status"></p>
    </section>
    <footer>Powered by Open-Meteo · No sign-up required</footer>
  </main>

  <script>
    const fallback = {
      name: "Tokyo", country: "Japan", latitude: 35.6762, longitude: 139.6503,
      current: { temperature_2m: 18, apparent_temperature: 18, wind_speed_10m: 12, weather_code: 0 },
      daily: {
        time: ["2026-09-16", "2026-09-17", "2026-09-18", "2026-09-19", "2026-09-20"],
        weather_code: [0, 1, 2, 3, 61], temperature_2m_max: [22, 24, 23, 21, 20], temperature_2m_min: [16, 17, 17, 15, 14]
      }
    };
    const labels = { 0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"], 45: ["Foggy", "🌫️"], 48: ["Foggy", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Drizzle", "🌦️"], 61: ["Light rain", "🌧️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"], 71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"], 80: ["Showers", "🌦️"], 81: ["Showers", "🌦️"], 82: ["Heavy showers", "⛈️"], 95: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"] };
    const $ = (id) => document.getElementById(id);
    const formatDay = (value, index) => index === 0 ? "Today" : new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(new Date(value + "T12:00:00"));

    function render(data, sourceMessage = "") {
      const current = data.current;
      const info = labels[current.weather_code] || ["Mixed conditions", "🌤️"];
      $("location").textContent = `${data.name}, ${data.country || "your area"}`;
      $("date").textContent = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric" }).format(new Date());
      $("temperature").textContent = Math.round(current.temperature_2m);
      $("feels-like").textContent = `${Math.round(current.apparent_temperature)}°C`;
      $("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      $("condition").innerHTML = `<strong>${info[0]}</strong>`;
      $("weather-icon").textContent = info[1];
      $("forecast").innerHTML = data.daily.time.map((day, i) => {
        const dayInfo = labels[data.daily.weather_code[i]] || ["Mixed", "🌤️"];
        return `<article class="day"><div class="day-name">${formatDay(day, i)}</div><div class="day-icon" aria-hidden="true">${dayInfo[1]}</div><span class="high">${Math.round(data.daily.temperature_2m_max[i])}°</span><span class="low">${Math.round(data.daily.temperature_2m_min[i])}°</span></article>`;
      }).join("");
      $("status").textContent = sourceMessage;
    }

    async function loadWeather(city) {
      $("search-button").disabled = true;
      $("status").className = "status";
      $("status").textContent = "Looking up the latest conditions…";
      try {
        const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        if (!geoResponse.ok) throw new Error("Location lookup failed");
        const geo = await geoResponse.json();
        if (!geo.results?.length) throw new Error("City not found");
        const place = geo.results[0];
        const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto`);
        if (!weatherResponse.ok) throw new Error("Forecast unavailable");
        const weather = await weatherResponse.json();
        render({ ...weather, name: place.name, country: place.country });
      } catch (error) {
        render(fallback, "Live data is unavailable right now — showing a Tokyo forecast.");
        $("status").className = "status error";
      } finally {
        $("search-button").disabled = false;
      }
    }

    $("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const city = $("city-input").value.trim();
      if (city) loadWeather(city);
    });
    render(fallback);
    loadWeather("Tokyo");
  </script>
</body>
</html>
